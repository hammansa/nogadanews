  <!-- GitHub Pages index, with optional Netlify build placeholders for parity. -->

  <script>
    // Make placeholders available to JS (if build replaces them they will be real values)
    (function(){
      var deployMeta = document.querySelector('meta[name="netlify:deploy_url"]');
      window.NETLIFY_DEPLOY_URL = deployMeta ? deployMeta.getAttribute('content') : '';
      window.NETLIFY_CONTEXT = (document.querySelector('meta[name="netlify:context"]')||{}).getAttribute('content') || '';
    })();
  </script>
