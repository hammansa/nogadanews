<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>노가다뉴스 — YNA-style</title>
  <meta name="netlify:context" content="__CONTEXT__" />
  <meta name="netlify:deploy_url" content="__DEPLOY_PRIME_URL__" />
  <link rel="canonical" href="__DEPLOY_PRIME_URL__/" />
  <link rel="stylesheet" href="/src/style.yna.css">
</head>
<body>
  <header class="yna-header"><div class="yna-logo">노가다뉴스</div></header>
  <main class="container">
    <section class="yna-hero">
      <div class="yna-main">
        <h2 id="heroTitle">오늘의 주요 뉴스</h2>
        <p id="heroLead" class="lead"></p>
      </div>
      <aside class="yna-side">
        <h4>주요 기사</h4>
        <div id="sideList"></div>
      </aside>
    </section>

    <section class="yna-list" id="restList"></section>
  </main>

  <script>
    async function load(){
      try{
        const r = await fetch('/news.json', {cache:'no-store'});
        const j = await r.json();
        const list = Array.isArray(j.articles)?j.articles:j;
        const lead = list[0];
        if(lead){ document.getElementById('heroTitle').textContent = lead.title || '주요 뉴스'; document.getElementById('heroLead').textContent = lead.excerpt || ''; }
        const side = document.getElementById('sideList');
        list.slice(1,6).forEach(it=>{ const d = document.createElement('div'); d.className='card'; d.innerHTML = `<img class="yna-thumb" src="${it.cover||'/assets/placeholder.png'}"><div><a href="/article.html?id=${it.id}">${it.title}</a><div class="meta">${it.date||''}</div></div>`; side.appendChild(d); });
        const rest = document.getElementById('restList');
        list.slice(6).forEach(it=>{ const el = document.createElement('article'); el.className='card'; el.innerHTML = `<img class="yna-thumb" src="${it.cover||'/assets/placeholder.png'}"><div><a href="/article.html?id=${it.id}">${it.title}</a><p class="meta">${it.date||''}</p></div>`; rest.appendChild(el); });
      }catch(e){ console.error(e); }
    }
    load();
  </script>

<!-- NOGADA_FOOTER -->
<footer class="nogada-footer" style="border-top:1px solid #eee;padding:20px;text-align:center;color:#555;font-size:0.95em;background:#fafafa;"><div class="footer-inner-wrap"><span class="footer-slogan-block">(노)동의 진실함을 믿는 사람들의<br>(가)교가 되어주는 따뜻한 정보로<br>(다)함께 내일을 만드는 신문</span><br>제보: 010-4151-2121</div></footer>
</body>
</html>
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOGADA NEWS — YNA-style Index</title>

  <meta name="netlify:context" content="__CONTEXT__" />
  <meta name="netlify:deploy_url" content="__DEPLOY_PRIME_URL__" />
  <link rel="canonical" href="__DEPLOY_PRIME_URL__/" />
  <meta property="og:url" content="__DEPLOY_PRIME_URL__/" />

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- YNA-like scaffold mapped to Nogada content -->
  <div class="yna-wrap">
    <header class="yna-header">
      <div class="yna-logo">NOGADA NEWS</div>
    </header>

    <main class="yna-main container">
      <section class="yna-hero">
        <h1 id="ynaHeroTitle">현장의 진실을 전합니다</h1>
        <p id="ynaHeroLead">Latest from NogadaNews mapped to YNA-style layout.</p>
      </section>

      <section class="yna-lists">
        <div id="ynaLeft" class="yna-col"></div>
        <div id="ynaRight" class="yna-col"></div>
      </section>
    </main>

    <footer class="yna-footer">© NOGADA NEWS</footer>
  </div>

  <script>
    // Basic loader: fetch news.json and populate left (top stories) and right (more)
    (async function(){
      try{
        const res = await fetch('/news.json', {cache:'no-store'});
        if(!res.ok) throw new Error('news.json load failed');
        const data = await res.json();
        const articles = Array.isArray(data.articles)?data.articles:[];

        const left = document.getElementById('ynaLeft');
        const right = document.getElementById('ynaRight');

        // Top 1 hero -> left, next 6 split
        if(articles.length>0){
          const hero = articles[0];
          document.getElementById('ynaHeroTitle').textContent = hero.title || '제목 없음';
          document.getElementById('ynaHeroLead').textContent = hero.excerpt || '';
        }

        const rest = articles.slice(1);
        rest.forEach((a,i)=>{
          const card = document.createElement('article');
          card.className = 'yna-card';
          card.innerHTML = `
            <a href="/article.html?id=${encodeURIComponent(a.id||'')}">
              <div class="yna-thumb"><img src="${a.cover||'/assets/worker.jpg'}" alt="" loading="lazy"></div>
              <div class="yna-meta">${a.category||''} · ${a.date||''}</div>
              <h3 class="yna-title">${(a.title||'').replace(/</g,'&lt;')}</h3>
              <p class="yna-excerpt">${(a.excerpt||'').replace(/</g,'&lt;')}</p>
            </a>`;
          if(i%2===0) left.appendChild(card); else right.appendChild(card);
        });
      }catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
