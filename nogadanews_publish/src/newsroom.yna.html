<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>노가다뉴스 — 뉴스룸 (YNA-style)</title>
  <link rel="stylesheet" href="/src/style.yna.css">
</head>
<body>
  <header class="yna-header"><div class="yna-logo">노가다뉴스</div></header>
  <main class="container">
    <h2>전체 기사</h2>
    <div class="yna-grid" id="grid"></div>
  </main>
  <footer class="yna-footer">© NOGADA NEWS</footer>
  <script>
    async function init(){
      try{
        const r = await fetch('/news.json',{cache:'no-store'});
        const j = await r.json();
        const list = Array.isArray(j.articles)?j.articles:j;
        const grid = document.getElementById('grid');
        list.forEach(it=>{
          const c = document.createElement('div'); c.className='card';
          c.innerHTML = `<img class="yna-thumb" src="${it.cover||'/assets/placeholder.png'}"><div><a href="/article.html?id=${it.id}">${it.title}</a><div class="meta">${it.date||''}</div></div>`;
          grid.appendChild(c);
        });
      }catch(e){console.error(e);}
    }
    init();
  </script>

<!-- NOGADA_FOOTER -->
<footer class="nogada-footer" style="border-top:1px solid #eee;padding:20px;text-align:center;color:#555;font-size:0.95em;background:#fafafa;"><div class="footer-inner-wrap"><span class="footer-slogan-block">(노)동의 진실함을 믿는 사람들의<br>(가)교가 되어주는 따뜻한 정보로<br>(다)함께 내일을 만드는 신문</span><br>제보: 010-4151-2121</div></footer>
</body>
</html>
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOGADA NEWS — YNA-style Newsroom</title>
  <meta name="netlify:context" content="__CONTEXT__" />
  <meta name="netlify:deploy_url" content="__DEPLOY_PRIME_URL__" />
  <link rel="canonical" href="__DEPLOY_PRIME_URL__/newsroom.html" />
  <meta property="og:url" content="__DEPLOY_PRIME_URL__/newsroom.html" />
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="yna-header"><div class="yna-logo">NOGADA NEWS</div></header>
  <main class="container yna-newsroom">
    <h1>뉴스룸</h1>
    <div id="ynaNewsGrid" class="yna-grid"></div>
  </main>
  <footer class="yna-footer">© NOGADA NEWS</footer>

  <script>
    (async function(){
      try{
        const res = await fetch('/news.json', {cache:'no-store'});
        if(!res.ok) throw new Error('news.json load failed');
        const data = await res.json();
        const articles = Array.isArray(data.articles)?data.articles:[];
        const grid = document.getElementById('ynaNewsGrid');
        grid.innerHTML = articles.map(a=>{
          return `
            <article class="yna-card">
              <a href="/article.html?id=${encodeURIComponent(a.id||'')}">
                <div class="yna-thumb"><img src="${a.cover||'/assets/worker.jpg'}" alt=""></div>
                <h3 class="yna-title">${(a.title||'').replace(/</g,'&lt;')}</h3>
                <div class="yna-meta">${a.category||''} · ${a.date||''}</div>
              </a>
            </article>`;
        }).join('');
      }catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
