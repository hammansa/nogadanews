<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>기사 본문 | 노가다뉴스</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 기사 본문 전용 스타일 */
    .article-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .article-header { margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
    .article-cat { color: var(--primary); font-weight: 800; font-size: 14px; margin-bottom: 12px; display: block; }
    .article-title { font-size: clamp(28px, 4vw, 40px); line-height: 1.3; font-weight: 900; margin-bottom: 20px; }
    .article-meta { color: var(--muted); font-size: 14px; display: flex; gap: 15px; }
    
    .article-hero-img { width: 100%; border-radius: 16px; margin-bottom: 40px; }
    
    .article-body { font-size: 18px; line-height: 1.8; color: #ddd; }
    .article-body p { margin-bottom: 24px; }
    .article-body blockquote { 
      border-left: 4px solid var(--primary); 
      padding-left: 20px; 
      margin: 40px 0; 
      font-style: italic; 
      color: var(--primary);
      font-weight: 700;
    }
    
    .article-footer { margin-top: 60px; padding-top: 30px; border-top: 1px solid var(--border); }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; }
    .btn-back:hover { color: var(--primary); }
  </style>
</head>
<body class="page-article">
  <header class="site-header">
    <div class="header-inner container">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/logo.png" alt="노가다뉴스 로고" />
        <span class="brand-text">NOGADA NEWS</span>
      </a>
      <nav class="nav">
        <a href="index.html">홈</a>
        <a href="newsroom.html">뉴스룸</a>
        <a href="rights.html">권익보호</a>
        <a href="community.html">현장커뮤니티</a>
      </nav>
      <a class="btn btn-kakao" href="https://open.kakao.com/0/gYojhMci" target="_blank" rel="noopener noreferrer">제보하기</a>
    </div>
  </header>

  <main class="article-container">
    <article id="articleContent">
      <div class="muted">기사를 불러오는 중입니다...</div>
    </article>
    
    <div class="article-footer">
      <a href="newsroom.html" class="btn-back">← 뉴스룸 목록으로 돌아가기</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner container"><!-- NOGADA_FOOTER -->
<footer class="nogada-footer" style="border-top:1px solid #eee;padding:20px;text-align:center;color:#555;font-size:0.95em;background:#fafafa;"><div class="footer-inner-wrap"><span class="footer-slogan-block">(노)동의 진실함을 믿는 사람들의<br>(가)교가 되어주는 따뜻한 정보로<br>(다)함께 내일을 만드는 신문</span><br>제보: 010-4151-2121</div></footer>

      <div class="muted">© 2026 NOGADA NEWS. All Rights Reserved.</div><div class="muted">발행인 : 강동진</div>
      <div class="muted">지주회사 : (주)MJN GROUP</div>
    </div>
  </footer>

  <script>
    const esc = (s) => (s ?? "").toString().replace(/[&<>\"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      
      try {
        const res = await fetch("news.json", { cache: "no-store" });
        const data = await res.json();
        const article = data.articles.find(a => a.id === id);
        const container = document.getElementById("articleContent");

        if (!article) {
          container.innerHTML = '<div class="muted">기사를 찾을 수 없습니다.</div>';
          return;
        }

        // 삼행시 슬로건 강조 처리 (창간사용)
        let processedContent = esc(article.content).replace(/\[(.*?)\]/g, '<blockquote>$1</blockquote>');

        container.innerHTML = `
          <header class="article-header">
            <span class="article-cat">${esc(article.category)}</span>
            <h1 class="article-title">${esc(article.title)}</h1>
            <div class="article-meta">
              <span>발행일: ${esc(article.date)}</span>
              <span>읽는 시간: ${esc(article.readTime)}</span>
            </div>
          </header>
          <img src="assets/hero-site-worker.jpg" class="article-hero-img" alt="현장 이미지">
          <div class="article-body">
            ${processedContent.split('\n').map(p => `<p>${p}</p>`).join('')}
          </div>
        `;
        document.title = `${article.title} | 노가다뉴스`;
      } catch (e) {
        console.error(e);
        document.getElementById("articleContent").innerHTML = '<div class="muted">내용을 불러오지 못했습니다.</div>';
      }
    }
    loadArticle();
  </script>

</body>
</html>
